# Transfer-oriented tracking recipe.  It mirrors robust_transfer.yaml while
# using the GOT-10k/SiamFC task and the same closed-loop, multi-QP objective.

device: auto
out_dir: outputs/robust_tracking
seed: 0

task:
  name: tracking
  backbone: resnet18
  exemplar_size: 127
  search_size: 255
  pos_radius: 2.0

model:
  base_ch: 32
  res_scale: 1.0
  max_relative_edit: 0.25
  cond_dim: 1
  qp_ref: [20, 51]

codec:
  kind: virtual
  qualities: [1, 2, 3, 5, 8]
  block: 8
  inter: true
  closed_loop: true
  step_coarse: 3.0
  step_fine: 1.0
  anneal: 1.0

data:
  index: data/index/got10k_3gb.json
  num_frames: 8
  frame_size: 256
  temporal_stride: 3

loss:
  lam_task: 1.0
  omega: 0.5
  beta: 0.01
  tau: 0.1
  delta: 0.02
  gamma: 0.03
  mu: 10.0
  use_task_mask: false

train:
  epochs: 5
  max_steps: null
  reg_warmup_frac: 0.5
  qp_per_step: 3
  batch_size: 2
  num_workers: 2
  lr: 1.0e-4
  qp_list: [22, 27, 32, 37, 42]
  qp_to_quality: {22: 5, 27: 3, 32: 2, 37: 1, 42: 1}
  cosine: true
  patience: 5
  min_delta: 1.0e-4
  val_max_batches: 20
  resume: false
  finetune: false

eval:
  split: test
  qp_list: [30, 35, 40, 45, 50]
  preset: medium
  max_seqs: 30
  max_frames: 48
  codec_chunk: 16

